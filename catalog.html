<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BookSphere - Browse our book catalog">
  <title>Catalog - BookSphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f7f4ee;
      --surface: #ffffff;
      --ink: #171512;
      --ink-soft: #514c46;
      --muted: #8a8478;
      --border: #ddd6c7;
      --accent: #9a2b2b;
      --accent-hover: #7c2222;
      --header: #171512;
      --header-text: #f0ede4;
      --success: #2f6b2f;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
    }

    h1, h2, h3 { font-family: 'Lora', serif; }

    header {
      background: var(--header);
      border-bottom: 3px solid var(--accent);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 68px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 32px;
      width: 100%;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
      color: var(--header-text);
    }

    .nav-links {
      display: flex;
      gap: 22px;
      list-style: none;
      align-items: center;
    }

    .nav-links a {
      color: var(--header-text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      opacity: 0.85;
    }

    .nav-links a:hover {
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .cart-link {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cart-badge {
      background: var(--accent);
      color: white;
      font-size: 11px;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }

    .logout-btn {
      padding: 8px 20px;
      border-radius: 2px;
      background: transparent;
      color: var(--header-text);
      border: 1px solid #4a463f;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    .logout-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .catalog-section {
      padding: 50px 0 70px;
    }

    .section-title {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .section-subtitle {
      color: var(--muted);
      margin-bottom: 36px;
      font-size: 14px;
    }

    .controls {
      display: flex;
      gap: 14px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .controls input {
      flex: 1;
      min-width: 260px;
      padding: 11px 14px;
      border-radius: 2px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      outline: none;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
    }

    .controls input::placeholder { color: #b3ac9c; }
    .controls input:focus { border-color: var(--ink); }

    .controls select {
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--surface);
      color: var(--ink);
      font-size: 14px;
      outline: none;
      min-width: 200px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }

    .controls select:focus { border-color: var(--ink); }

    .loading-message, .no-results {
      color: var(--muted);
      padding: 50px 20px;
      font-size: 15px;
      text-align: center;
    }

    .error-message {
      background: #fbeaea;
      border: 1px solid #d99;
      color: #8a2020;
      padding: 14px 18px;
      border-radius: 2px;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .book-card {
      background: var(--surface);
      padding: 18px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .fav-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 30px;
      height: 30px;
      border-radius: 2px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      z-index: 2;
    }

    .fav-toggle:hover { border-color: var(--accent); }

    .fav-toggle.active {
      border-color: var(--accent);
      background: #fbeaea;
    }

    .book-image {
      width: 100%;
      height: 260px;
      object-fit: cover;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }

    .book-title {
      font-size: 16px;
      margin-bottom: 4px;
      color: var(--ink);
      font-weight: 600;
      min-height: 42px;
    }

    .book-author {
      color: var(--muted);
      margin-bottom: 10px;
      font-size: 13px;
    }

    .book-price {
      color: var(--accent);
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
      font-family: 'Lora', serif;
    }

    .btn {
      padding: 10px 14px;
      border-radius: 2px;
      background: var(--ink);
      color: white;
      border: 1px solid var(--ink);
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      margin-top: auto;
    }

    .btn:hover { background: var(--accent); border-color: var(--accent); }

    .btn.in-cart {
      background: var(--success);
      border-color: var(--success);
    }

    footer {
      background: var(--header);
      color: var(--header-text);
      padding: 40px 0;
      margin-top: 20px;
      text-align: center;
    }

    footer p {
      color: #a8a29a;
      font-size: 13px;
    }

    @media (max-width: 640px) {
      .navbar { padding: 0 20px; }
      .nav-links { gap: 14px; }
      .section-title { font-size: 26px; }
      .books-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 420px) {
      .books-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="navbar">
      <a href="index.html" class="logo">📚 BookSphere</a>
      <ul class="nav-links">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li>
          <a href="cart.html" class="cart-link">
            Cart <span class="cart-badge" id="cartCount">0</span>
          </a>
        </li>
        <li><a href="index.html">Home</a></li>
        <li><button class="logout-btn" onclick="logout()">Logout</button></li>
      </ul>
    </div>
  </header>

  <main class="catalog-section">
    <div class="container">
      <h2 class="section-title">Book Catalogue</h2>
      <p class="section-subtitle">Browse the full collection across every genre</p>

      <div id="errorContainer"></div>

      <div class="controls">
        <input
          type="text"
          id="searchInput"
          placeholder="Search by title..."
          onkeyup="filterBooks()"
        >
        <select id="categorySelect" onchange="filterBooks()">
          <option>All</option>
          <option>Programming</option>
          <option>Business</option>
          <option>Fiction</option>
          <option>Self Help</option>
          <option>Biography</option>
          <option>Productivity</option>
          <option>Science</option>
          <option>History</option>
          <option>Fantasy</option>
          <option>Mystery</option>
        </select>
      </div>

      <div id="loadingMessage" class="loading-message" style="display: none;">Loading books...</div>
      <div id="noResultsMessage" class="no-results" style="display: none;">No books found. Try adjusting your search or filters.</div>

      <div id="booksContainer" class="books-grid"></div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>© 2026 BookSphere. All Rights Reserved.</p>
    </div>
  </footer>

  <script>
    const API_URL = "http://localhost:5000";
    let allBooks = [];

    function logout() {
      if (confirm("Are you sure you want to logout?")) {
        localStorage.removeItem("user");
        localStorage.removeItem("loginTime");
        window.location.href = "index.html";
      }
    }

    function getFavorites() {
      return JSON.parse(localStorage.getItem("favorites")) || [];
    }

    function getCart() {
      return JSON.parse(localStorage.getItem("cart")) || [];
    }

    function updateCartBadge() {
      const cart = getCart();
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById("cartCount").textContent = count;
    }

    async function loadBooks() {
      const loadingMsg = document.getElementById("loadingMessage");
      const errorContainer = document.getElementById("errorContainer");

      loadingMsg.style.display = "block";
      errorContainer.innerHTML = "";

      try {
        const response = await fetch(`${API_URL}/api/books`);
        if (!response.ok) throw new Error("Failed to fetch books");

        allBooks = await response.json();
        loadingMsg.style.display = "none";
        displayBooks(allBooks);
      } catch (err) {
        loadingMsg.style.display = "none";
        errorContainer.innerHTML = '<div class="error-message">Unable to load books. Please check your connection and try again.</div>';
        console.error(err);
      }
    }

    function displayBooks(books) {
      const booksContainer = document.getElementById("booksContainer");
      const noResultsMsg = document.getElementById("noResultsMessage");
      const favorites = getFavorites();
      const cart = getCart();

      if (books.length === 0) {
        booksContainer.innerHTML = "";
        noResultsMsg.style.display = "block";
        return;
      }

      noResultsMsg.style.display = "none";
      booksContainer.innerHTML = books
        .map((book) => {
          const isFavorited = favorites.some(fav => fav.title === book.title && fav.author === book.author);
          const isInCart = cart.some(item => item.title === book.title && item.author === book.author);
          return `
        <div class="book-card">
          <div class="fav-toggle ${isFavorited ? "active" : ""}" onclick="toggleFavorite('${escapeQuotes(book.title)}', '${escapeQuotes(book.author)}', this)">
            ${isFavorited ? "♥" : "♡"}
          </div>
          <img src="${book.image}" alt="${book.title}" class="book-image">
          <h3 class="book-title">${book.title}</h3>
          <p class="book-author">${book.author}</p>
          <h2 class="book-price">₹${book.price}</h2>
          <button class="btn ${isInCart ? "in-cart" : ""}"
                  onclick="addToCart('${escapeQuotes(book.title)}', '${escapeQuotes(book.author)}', ${book.price}, '${escapeQuotes(book.image)}', this)">
            ${isInCart ? "Added" : "Add to Cart"}
          </button>
        </div>
      `;
        })
        .join("");
    }

    function escapeQuotes(str) {
      return String(str).replace(/'/g, "\\'");
    }

    function filterBooks() {
      const searchTerm = document.getElementById("searchInput").value.toLowerCase();
      const categoryTerm = document.getElementById("categorySelect").value;

      const filtered = allBooks.filter(
        (book) =>
          (categoryTerm === "All" || book.category === categoryTerm) &&
          book.title.toLowerCase().includes(searchTerm)
      );

      displayBooks(filtered);
    }

    function toggleFavorite(title, author, el) {
      let favorites = getFavorites();
      const isFavorited = favorites.some(fav => fav.title === title && fav.author === author);

      if (isFavorited) {
        favorites = favorites.filter(fav => !(fav.title === title && fav.author === author));
        el.textContent = "♡";
        el.classList.remove("active");
      } else {
        favorites.push({ title, author });
        el.textContent = "♥";
        el.classList.add("active");
      }

      localStorage.setItem("favorites", JSON.stringify(favorites));
    }

    function addToCart(title, author, price, image, btn) {
      let cart = getCart();
      const existing = cart.find(item => item.title === title && item.author === author);

      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ title, author, price, image, quantity: 1 });
      }

      localStorage.setItem("cart", JSON.stringify(cart));
      updateCartBadge();

      btn.textContent = "Added";
      btn.classList.add("in-cart");
    }

    function checkLogin() {
      const user = localStorage.getItem("user");
      if (!user) {
        window.location.href = "login.html";
      }
    }

    window.addEventListener("load", () => {
      checkLogin();
      updateCartBadge();
      loadBooks();
    });
  </script>
</body>
</html>
