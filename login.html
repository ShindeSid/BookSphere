<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BookSphere - Login to your account">
  <title>Login - BookSphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #07122e, #0f1f45, #1d3557);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(8, 18, 45, 0.85);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0 20px;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 75px;
      max-width: 1300px;
      margin: 0 auto;
      width: 100%;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      font-weight: 700;
      text-decoration: none;
      color: white;
    }

    .logo-icon {
      color: #ffd54a;
      font-size: 28px;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #7b61ff;
    }

    .container {
      width: 90%;
      max-width: 1300px;
      margin: 0 auto;
    }

    .login-wrapper {
      margin-top: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 75px);
      padding: 40px 20px;
    }

    .form-container {
      width: 420px;
      max-width: 95%;
      padding: 40px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 32px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    label {
      font-weight: 500;
      margin-bottom: 8px;
      color: #f2f2f2;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: white;
      outline: none;
      font-size: 15px;
      transition: 0.3s;
    }

    input::placeholder {
      color: #d0d0d0;
    }

    input:focus {
      border-color: #7b61ff;
      background: rgba(255, 255, 255, 0.12);
    }

    input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      background: rgba(255, 67, 67, 0.15);
      border: 1px solid rgba(255, 67, 67, 0.3);
      color: #ff6b6b;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 14px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      background: rgba(75, 192, 75, 0.15);
      border: 1px solid rgba(75, 192, 75, 0.3);
      color: #4bc04b;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 14px;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    button {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      background: #5b5ff8;
      color: white;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: 0.4s;
      margin-top: 10px;
    }

    button:hover:not(:disabled) {
      background: #7b61ff;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .footer-text {
      margin-top: 20px;
      text-align: center;
      color: #d6d6d6;
    }

    .footer-text a {
      color: #7b61ff;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s;
    }

    .footer-text a:hover {
      color: #ffd54a;
    }

    @media (max-width: 768px) {
      .form-container {
        padding: 30px;
      }

      .navbar {
        height: 60px;
      }

      .login-wrapper {
        margin-top: 60px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="navbar">
      <a href="index.html" class="logo">
        <span class="logo-icon">📚</span>
        <span>BookSphere</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </div>
  </header>

  <div class="login-wrapper">
    <div class="form-container">
      <h2>Welcome Back</h2>

      <div class="error-message" id="errorMessage"></div>
      <div class="success-message" id="successMessage"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required disabled>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required disabled>
        </div>

        <button type="submit" id="loginBtn">Login</button>
      </form>

      <p class="footer-text">
        Don't have an account? <a href="register.html">Register here</a>
      </p>
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:5000";

    // Enable form after page load
    window.addEventListener('load', () => {
      document.getElementById('email').disabled = false;
      document.getElementById('password').disabled = false;
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const errorMsg = document.getElementById('errorMessage');
      const successMsg = document.getElementById('successMessage');

      errorMsg.classList.remove('show');
      successMsg.classList.remove('show');

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      try {
        const response = await fetch(`${API_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          successMsg.textContent = 'Login successful! Redirecting...';
          successMsg.classList.add('show');
          localStorage.setItem('user', JSON.stringify(data.user));
          localStorage.setItem('loginTime', new Date().toLocaleString());
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1500);
        } else {
          errorMsg.textContent = data.message || 'Login failed. Please try again.';
          errorMsg.classList.add('show');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Login';
        }
      } catch (err) {
        errorMsg.textContent = 'Unable to connect to server. Please try again later.';
        errorMsg.classList.add('show');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
