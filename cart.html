<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BookSphere - Your Shopping Cart">
  <title>Cart - BookSphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f7f4ee;
      --surface: #ffffff;
      --ink: #171512;
      --ink-soft: #514c46;
      --muted: #8a8478;
      --border: #ddd6c7;
      --accent: #9a2b2b;
      --accent-hover: #7c2222;
      --header: #171512;
      --header-text: #f0ede4;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    h1, h2, h3 { font-family: 'Lora', serif; }

    header {
      background: var(--header);
      border-bottom: 3px solid var(--accent);
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 68px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 32px;
      width: 100%;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
      color: var(--header-text);
    }

    .nav-links {
      display: flex;
      gap: 22px;
      list-style: none;
    }

    .nav-links a {
      color: var(--header-text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      opacity: 0.85;
    }

    .nav-links a:hover {
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .container {
      width: 90%;
      max-width: 880px;
      margin: 0 auto;
    }

    .cart-section {
      padding: 60px 0 80px;
    }

    .section-title {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .section-subtitle {
      color: var(--muted);
      margin-bottom: 40px;
      font-size: 14px;
    }

    .empty-cart {
      text-align: center;
      padding: 70px 20px;
      color: var(--muted);
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .empty-cart p {
      font-size: 15px;
      margin-bottom: 22px;
    }

    .cart-items {
      border: 1px solid var(--border);
      background: var(--surface);
      margin-bottom: 30px;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 64px 1fr auto auto auto;
      align-items: center;
      gap: 20px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
    }

    .cart-item:last-child { border-bottom: none; }

    .cart-item img {
      width: 64px;
      height: 84px;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .cart-item-info h3 {
      font-size: 16px;
      color: var(--ink);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .cart-item-info p {
      color: var(--muted);
      font-size: 12px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      padding: 5px 8px;
    }

    .qty-controls button {
      width: 22px;
      height: 22px;
      border-radius: 2px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      font-size: 14px;
      cursor: pointer;
    }

    .qty-controls button:hover { border-color: var(--accent); color: var(--accent); }

    .qty-controls span {
      min-width: 18px;
      text-align: center;
      font-weight: 600;
      font-size: 13px;
    }

    .item-price {
      color: var(--accent);
      font-size: 16px;
      font-weight: 700;
      min-width: 80px;
      text-align: right;
      font-family: 'Lora', serif;
    }

    .remove-item {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--ink-soft);
      padding: 8px 12px;
      border-radius: 2px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .remove-item:hover { border-color: var(--accent); color: var(--accent); }

    .cart-summary {
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 30px 34px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      color: var(--ink-soft);
      font-size: 14px;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      padding-top: 16px;
      margin-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 20px;
      font-weight: 700;
      font-family: 'Lora', serif;
    }

    .summary-total span:last-child { color: var(--accent); }

    .checkout-btn {
      width: 100%;
      padding: 14px;
      border-radius: 2px;
      background: var(--ink);
      color: white;
      border: 1px solid var(--ink);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 22px;
    }

    .checkout-btn:hover { background: var(--accent); border-color: var(--accent); }

    .btn {
      display: inline-block;
      padding: 10px 26px;
      border-radius: 2px;
      background: var(--ink);
      color: white;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid var(--ink);
      font-size: 13px;
    }

    .btn:hover { background: var(--accent); border-color: var(--accent); }

    footer {
      background: var(--header);
      color: var(--header-text);
      padding: 40px 0;
      margin-top: 20px;
      text-align: center;
    }

    footer p {
      color: #a8a29a;
      font-size: 13px;
    }

    @media (max-width: 640px) {
      .navbar { padding: 0 20px; }

      .cart-item {
        grid-template-columns: 48px 1fr;
        grid-template-areas:
          "img info"
          "img qty"
          "img price"
          "img remove";
        row-gap: 10px;
      }

      .cart-item img { grid-area: img; width: 48px; height: 64px; }
      .cart-item-info { grid-area: info; }
      .qty-controls { grid-area: qty; justify-self: start; }
      .item-price { grid-area: price; text-align: left; }
      .remove-item { grid-area: remove; justify-self: start; }
    }
  </style>
</head>
<body>
  <header>
    <div class="navbar">
      <a href="index.html" class="logo">📚 BookSphere</a>
      <ul class="nav-links">
        <li><a href="catalog.html">Catalog</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="index.html">Home</a></li>
      </ul>
    </div>
  </header>

  <main class="cart-section">
    <div class="container">
      <h2 class="section-title">Your Cart</h2>
      <p class="section-subtitle">Review your books before checkout</p>

      <div id="cartContent"></div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>© 2026 BookSphere. All Rights Reserved.</p>
    </div>
  </footer>

  <script>
    function getCart() {
      return JSON.parse(localStorage.getItem("cart")) || [];
    }

    function saveCart(cart) {
      localStorage.setItem("cart", JSON.stringify(cart));
    }

    function renderCart() {
      const cart = getCart();
      const cartContent = document.getElementById("cartContent");

      if (cart.length === 0) {
        cartContent.innerHTML = `
          <div class="empty-cart">
            <p>Your cart is empty. Start browsing to add some books.</p>
            <a href="catalog.html" class="btn">Browse Catalog</a>
          </div>
        `;
        return;
      }

      const itemsHtml = cart.map((item, index) => `
        <div class="cart-item">
          <img src="${item.image}" alt="${item.title}">
          <div class="cart-item-info">
            <h3>${item.title}</h3>
            <p>${item.author}</p>
          </div>
          <div class="qty-controls">
            <button onclick="changeQuantity(${index}, -1)">−</button>
            <span>${item.quantity}</span>
            <button onclick="changeQuantity(${index}, 1)">+</button>
          </div>
          <div class="item-price">₹${item.price * item.quantity}</div>
          <button class="remove-item" onclick="removeItem(${index})">Remove</button>
        </div>
      `).join("");

      const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      const itemCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      const shipping = subtotal > 999 ? 0 : 49;
      const total = subtotal + shipping;

      cartContent.innerHTML = `
        <div class="cart-items">${itemsHtml}</div>
        <div class="cart-summary">
          <div class="summary-row">
            <span>Subtotal (${itemCount} item${itemCount !== 1 ? "s" : ""})</span>
            <span>₹${subtotal}</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span>${shipping === 0 ? "Free" : "₹" + shipping}</span>
          </div>
          <div class="summary-total">
            <span>Total</span>
            <span>₹${total}</span>
          </div>
          <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
      `;
    }

    function changeQuantity(index, delta) {
      const cart = getCart();
      cart[index].quantity += delta;

      if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
      }

      saveCart(cart);
      renderCart();
    }

    function removeItem(index) {
      const cart = getCart();
      cart.splice(index, 1);
      saveCart(cart);
      renderCart();
    }

    function checkout() {
      alert("This is a demo checkout. In a real store, this would take you to payment.");
    }

    function checkLogin() {
      const user = localStorage.getItem("user");
      if (!user) {
        window.location.href = "login.html";
      }
    }

    window.addEventListener("load", () => {
      checkLogin();
      renderCart();
    });
  </script>
</body>
</html>
