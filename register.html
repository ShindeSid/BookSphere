<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BookSphere - Create your account">
  <title>Register - BookSphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f7f4ee;
      --surface: #ffffff;
      --ink: #171512;
      --ink-soft: #514c46;
      --muted: #8a8478;
      --border: #ddd6c7;
      --accent: #9a2b2b;
      --accent-hover: #7c2222;
      --header: #171512;
      --header-text: #f0ede4;
      --error-bg: #fbeaea;
      --error-border: #d99;
      --error-text: #8a2020;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    h1, h2 { font-family: 'Lora', serif; }

    header {
      background: var(--header);
      border-bottom: 3px solid var(--accent);
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 68px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 32px;
      width: 100%;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
      color: var(--header-text);
    }

    .nav-links {
      display: flex;
      gap: 24px;
      list-style: none;
    }

    .nav-links a {
      color: var(--header-text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      opacity: 0.85;
    }

    .nav-links a:hover {
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .register-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 68px);
      padding: 60px 20px;
    }

    .form-container {
      width: 400px;
      max-width: 95%;
      padding: 44px 40px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .form-container h2 {
      margin-bottom: 6px;
      font-size: 26px;
      font-weight: 600;
    }

    .form-lede {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    label {
      font-weight: 600;
      margin-bottom: 7px;
      color: var(--ink);
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 11px 13px;
      border-radius: 2px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      outline: none;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
    }

    input::placeholder { color: #b3ac9c; }
    input:focus { border-color: var(--ink); }
    input:disabled { opacity: 0.6; }

    .error-message {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 11px 14px;
      border-radius: 2px;
      margin-bottom: 18px;
      font-size: 13px;
      display: none;
    }

    .error-message.show { display: block; }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 2px;
      background: var(--ink);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--ink);
      cursor: pointer;
      margin-top: 6px;
    }

    button:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .footer-text {
      margin-top: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .footer-text a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .footer-text a:hover { text-decoration: underline; }

    .password-hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
    }

    @media (max-width: 480px) {
      .form-container { padding: 34px 26px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="navbar">
      <a href="index.html" class="logo">📚 BookSphere</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </div>
  </header>

  <div class="register-wrapper">
    <div class="form-container">
      <h2>Create Account</h2>
      <p class="form-lede">It only takes a minute to get started.</p>

      <div class="error-message" id="errorMessage"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="John Doe" required disabled>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required disabled>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Minimum 6 characters" required disabled>
          <div class="password-hint">At least 6 characters required</div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required disabled>
        </div>

        <button type="submit" id="registerBtn">Register</button>
      </form>

      <p class="footer-text">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:5000";

    window.addEventListener("load", () => {
      document.getElementById("name").disabled = false;
      document.getElementById("email").disabled = false;
      document.getElementById("password").disabled = false;
      document.getElementById("confirmPassword").disabled = false;
    });

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const registerBtn = document.getElementById("registerBtn");
      const errorMsg = document.getElementById("errorMessage");

      errorMsg.classList.remove("show");

      if (password !== confirmPassword) {
        errorMsg.textContent = "Passwords do not match. Please try again.";
        errorMsg.classList.add("show");
        return;
      }

      if (password.length < 6) {
        errorMsg.textContent = "Password must be at least 6 characters long.";
        errorMsg.classList.add("show");
        return;
      }

      registerBtn.disabled = true;
      registerBtn.textContent = "Registering...";

      try {
        const response = await fetch(`${API_URL}/api/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (response.ok) {
          window.location.href = "login.html";
        } else {
          errorMsg.textContent = data.message || "Registration failed. Please try again.";
          errorMsg.classList.add("show");
          registerBtn.disabled = false;
          registerBtn.textContent = "Register";
        }
      } catch (err) {
        errorMsg.textContent = "Unable to connect to server. Please try again later.";
        errorMsg.classList.add("show");
        registerBtn.disabled = false;
        registerBtn.textContent = "Register";
      }
    });
  </script>
</body>
</html>
